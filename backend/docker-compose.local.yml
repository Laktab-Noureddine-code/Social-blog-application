# =============================================================================
# DOCKER COMPOSE - LOCAL DEVELOPMENT ORCHESTRATOR
# =============================================================================
# Stack: Laravel 11 + Nginx + MySQL 8 + Redis + Reverb + Queue Worker
# Usage: docker-compose -f docker-compose.local.yml up --build
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # APP - PHP-FPM (Laravel Application)
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      # Mount source code for local development (hot reload)
      - .:/var/www
      # Persist composer cache
      - composer_cache:/root/.composer/cache
    environment:
      - APP_ENV=local
      - CONTAINER_ROLE=app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - laravel-network

  # ---------------------------------------------------------------------------
  # WEB - Nginx (Reverse Proxy & Static Files)
  # ---------------------------------------------------------------------------
  web:
    image: nginx:alpine
    container_name: laravel_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      # Laravel public files
      - .:/var/www
      # Custom Nginx config
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - laravel-network

  # ---------------------------------------------------------------------------
  # MYSQL - Database Server
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: laravel_mysql
    restart: unless-stopped
    ports:
      # Exposed for TablePlus / external DB tools
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      # Persist database data
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - laravel-network

  # ---------------------------------------------------------------------------
  # REDIS - Cache, Sessions & Queue Broker
  # ---------------------------------------------------------------------------
  redis:
    image: redis:alpine
    container_name: laravel_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      # Persist Redis data
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - laravel-network

  # ---------------------------------------------------------------------------
  # REVERB - Laravel WebSocket Server
  # ---------------------------------------------------------------------------
  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_reverb
    restart: unless-stopped
    working_dir: /var/www
    ports:
      # Expose WebSocket port for direct connections
      - "8080:8080"
    volumes:
      - .:/var/www
    environment:
      - APP_ENV=local
      - CONTAINER_ROLE=reverb
    command: php artisan reverb:start --host=0.0.0.0 --port=8080 --debug
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - laravel-network

  # ---------------------------------------------------------------------------
  # WORKER - Queue Worker (Background Jobs)
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_worker
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    environment:
      - APP_ENV=local
      - CONTAINER_ROLE=worker
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - laravel-network

  # ---------------------------------------------------------------------------
  # SCHEDULER - Laravel Task Scheduler (Optional)
  # ---------------------------------------------------------------------------
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_scheduler
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    environment:
      - APP_ENV=local
      - CONTAINER_ROLE=scheduler
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - laravel-network

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  laravel-network:
    driver: bridge
    name: laravel-network

# =============================================================================
# VOLUMES (Persistent Data)
# =============================================================================
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  composer_cache:
    driver: local
